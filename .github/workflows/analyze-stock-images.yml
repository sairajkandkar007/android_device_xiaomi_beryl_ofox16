name: Analyze Stock Images for OFOX16

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release containing the extracted stock images"
        required: true
        default: "stock-images"
        type: string

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils android-sdk-ext4-utils cpio file lz4 zstd unzip e2fsprogs erofs-utils binutils xxd

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p analysis/images
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir analysis/images
          find analysis/images -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Reassemble split images
        run: |
          cd analysis/images
          for prefix in vendor.img system.img product.img odm.img; do
            parts=( "$prefix".part* )
            if [ -e "${parts[0]}" ]; then
              cat "${parts[@]}" > "$prefix"
              echo "Reassembled $prefix from ${#parts[@]} parts"
            fi
          done

      - name: Analyze image inventory and headers
        run: |
          mkdir -p analysis/report analysis/work
          {
            echo "# Beryl OFOX16 Stock Image Analysis"
            echo
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "## Image inventory"
            echo
            printf '| Image | Size | file(1) |\n|---|---:|---|\n'
            find analysis/images -maxdepth 1 -type f ! -name '*.part*' -printf '%f\n' | sort | while read -r f; do
              size=$(stat -c '%s' "analysis/images/$f")
              kind=$(file -b "analysis/images/$f" | tr '|' '/')
              printf '| %s | %s | %s |\n' "$f" "$size" "$kind"
            done
            echo
            echo "## Boot-related headers"
            for f in boot.img vendor_boot.img init_boot.img dtbo.img; do
              if [ -f "analysis/images/$f" ]; then
                echo
                echo "### $f"
                file "analysis/images/$f"
                xxd -l 128 "analysis/images/$f"
              fi
            done
          } > analysis/report/01-image-inventory.md

      - name: Parse and inspect vendor_boot
        run: |
          set -e
          mkdir -p analysis/work/vendor_boot analysis/report
          if [ -f analysis/images/vendor_boot.img ]; then
            python3 <<'PY'
import math
import pathlib
import struct

p = pathlib.Path("analysis/images/vendor_boot.img")
b = p.read_bytes()

if b[:8] != b"VNDRBOOT":
    raise SystemExit(f"Unexpected vendor_boot magic: {b[:8]!r}")

# vendor_boot v3/v4 header:
# magic(8), version(4), page_size(4), kernel_addr(4),
# ramdisk_addr(4), vendor_ramdisk_size(4), cmdline(2048),
# tags_addr(4), name(16), header_size(4), dtb_size(4), dtb_addr(8)
version, page_size, kernel_addr, ramdisk_size = struct.unpack_from("<4I", b, 8)
ramdisk_addr = struct.unpack_from("<I", b, 24)[0]
cmdline = b[28:2076].split(b"\0", 1)[0].decode("utf-8", "replace")
tags_addr = struct.unpack_from("<I", b, 2076)[0]
name = b[2080:2096].split(b"\0", 1)[0].decode("utf-8", "replace")
header_size = struct.unpack_from("<I", b, 2096)[0]
dtb_size = struct.unpack_from("<I", b, 2100)[0]
dtb_addr = struct.unpack_from("<Q", b, 2104)[0]

info = [
    f"header_version={version}",
    f"page_size={page_size}",
    f"kernel_addr=0x{kernel_addr:x}",
    f"ramdisk_addr=0x{ramdisk_addr:x}",
    f"vendor_ramdisk_size={ramdisk_size}",
    f"header_size={header_size}",
    f"dtb_size={dtb_size}",
    f"dtb_addr=0x{dtb_addr:x}",
    f"name={name}",
    f"cmdline={cmdline}",
]

ramdisk_base = math.ceil(header_size / page_size) * page_size
info.append(f"ramdisk_base=0x{ramdisk_base:x}")

if len(b) < ramdisk_base + ramdisk_size:
    raise SystemExit("vendor_boot is shorter than the declared vendor ramdisk")

ramdisk = b[ramdisk_base:ramdisk_base + ramdisk_size]
pathlib.Path("analysis/work/vendor_boot/vendor_ramdisk.bin").write_bytes(ramdisk)

if version >= 4:
    # v4 adds: table_size, table_entry_num, table_entry_size, bootconfig_size
    # immediately after dtb_addr.
    table_size, table_count, table_entry_size, bootconfig_size = struct.unpack_from(
        "<4I", b, 2112
    )
    info += [
        f"vendor_ramdisk_table_size={table_size}",
        f"vendor_ramdisk_table_entry_num={table_count}",
        f"vendor_ramdisk_table_entry_size={table_entry_size}",
        f"bootconfig_size={bootconfig_size}",
    ]

    table_base = math.ceil(
        (ramdisk_base + ramdisk_size + dtb_size) / page_size
    ) * page_size
    info.append(f"ramdisk_table_base=0x{table_base:x}")

    if table_entry_size == 108 and table_count * table_entry_size <= table_size:
        for i in range(table_count):
            off = table_base + i * table_entry_size
            if off + table_entry_size > len(b):
                break

            fragment_size, fragment_offset, fragment_type = struct.unpack_from(
                "<3I", b, off
            )
            fragment_name = b[off + 12:off + 44].split(
                b"\0", 1
            )[0].decode("utf-8", "replace")

            info.append(
                f"ramdisk_fragment[{i}]: "
                f"size={fragment_size} offset=0x{fragment_offset:x} "
                f"type={fragment_type} name={fragment_name}"
            )

            if fragment_offset + fragment_size <= len(ramdisk):
                fragment = ramdisk[
                    fragment_offset:fragment_offset + fragment_size
                ]
                safe_name = fragment_name or str(fragment_type)
                pathlib.Path(
                    f"analysis/work/vendor_boot/"
                    f"ramdisk_fragment_{i}_{safe_name}.bin"
                ).write_bytes(fragment)

pathlib.Path("analysis/report/vendor_boot_header.txt").write_text(
    "\n".join(info) + "\n"
)
PY

            cat analysis/report/vendor_boot_header.txt
            cat analysis/report/vendor_boot_header.txt >> analysis/report/01-image-inventory.md

            : > analysis/report/vendor_ramdisk_files.txt
            for ramdisk_bin in analysis/work/vendor_boot/*.bin; do
              [ -f "$ramdisk_bin" ] || continue
              out="analysis/report/$(basename "$ramdisk_bin").txt"
              echo "### $ramdisk_bin" >> "$out"
              file "$ramdisk_bin" >> "$out"

              if file "$ramdisk_bin" | grep -qi gzip; then
                gzip -dc "$ramdisk_bin" 2>/dev/null | cpio -itv >> "$out" 2>&1 || true
              elif file "$ramdisk_bin" | grep -qi lz4; then
                lz4 -dc "$ramdisk_bin" 2>/dev/null | cpio -itv >> "$out" 2>&1 || true
              elif file "$ramdisk_bin" | grep -qi zstd; then
                zstd -dc "$ramdisk_bin" 2>/dev/null | cpio -itv >> "$out" 2>&1 || true
              else
                cpio -itv < "$ramdisk_bin" >> "$out" 2>&1 || true
              fi

              cat "$out" >> analysis/report/vendor_ramdisk_files.txt
              echo >> analysis/report/vendor_ramdisk_files.txt
            done
          fi

      - name: Extract filesystem images for recovery analysis
        run: |
          set -e
          mkdir -p analysis/work/fs
          cat > analysis/work/extract_fs.sh <<'SH'
          #!/usr/bin/env bash
          set -e
          img="$1"
          name="$2"
          out="analysis/work/fs/$name"
          mkdir -p "$out"

          echo "=== $name ===" | tee "$out/summary.txt"
          file "$img" | tee -a "$out/summary.txt"

          fstype=""
          if file "$img" | grep -qi 'EROFS'; then
            fstype=erofs
          elif file "$img" | grep -Eqi 'ext4 filesystem|Linux.*ext4'; then
            fstype=ext4
          fi

          if [ "$fstype" = erofs ]; then
            if command -v fsck.erofs >/dev/null 2>&1; then
              mkdir -p "$out/rootfs"
              fsck.erofs --extract="$out/rootfs" "$img" || true
            fi
          elif [ "$fstype" = ext4 ]; then
            mkdir -p "$out/rootfs"
            debugfs -R "rdump / $out/rootfs" "$img" > "$out/debugfs.log" 2>&1 || true
          fi

          if [ -d "$out/rootfs" ]; then
            find "$out/rootfs" -type f | sort > "$out/files.txt"
            echo "file_count=$(wc -l < "$out/files.txt")" | tee -a "$out/summary.txt"
          else
            echo "filesystem extraction unavailable" | tee -a "$out/summary.txt"
          fi
          SH
          chmod +x analysis/work/extract_fs.sh

          for pair in             "analysis/images/vendor_dlkm.img vendor_dlkm"             "analysis/images/system_dlkm.img system_dlkm"             "analysis/images/vendor.img vendor"             "analysis/images/odm.img odm"; do
            set -- $pair
            [ -f "$1" ] || continue
            analysis/work/extract_fs.sh "$1" "$2"
          done

          {
            echo "# Extracted filesystem inventory"
            echo
            for d in analysis/work/fs/*; do
              [ -d "$d" ] || continue
              echo "## $(basename "$d")"
              cat "$d/summary.txt" 2>/dev/null || true
              echo
            done
          } > analysis/report/06-filesystem-inventory.md

      - name: Analyze extracted modules and crypto components
        run: |
          set -e
          {
            echo "# Beryl recovery module and crypto analysis"
            echo
            echo "## Kernel modules"
            find analysis/work/fs -type f \( -name '*.ko' -o -name '*.ko.*' \) -print | sort
            echo
            echo "## Relevant module names"
            find analysis/work/fs -type f \( -name '*.ko' -o -name '*.ko.*' \) -printf '%f\n' |
              grep -Ei '(dm|crypt|fscrypt|f2fs|ext4|ufs|mmc|sdhci|crypto|key|virtio|storage|avb)' |
              sort -u || true
            echo
            echo "## Module metadata"
            while IFS= read -r mod; do
              echo
              echo "### $mod"
              file "$mod"
              strings -a "$mod" |
                grep -E 'vermagic=|depends=|parm=|__versions|module_layout' |
                head -n 80 || true
            done < <(find analysis/work/fs -type f \( -name '*.ko' -o -name '*.ko.*' \) -print | sort)

            echo
            echo "## KeyMint / Keymaster / Gatekeeper / TEE"
            find analysis/work/fs -type f -printf '%p\n' |
              grep -Ei '(keymint|keymaster|keystore2|gatekeeper|trusty|tee|tpm|weaver|strongbox)' |
              sort -u || true

            echo
            echo "## FBE / fscrypt / vold"
            find analysis/work/fs -type f -printf '%p\n' |
              grep -Ei '(fscrypt|cryptfs|vold|fbe|metadata|keyref|wrappedkey)' |
              sort -u || true

            echo
            echo "## Encryption-related libraries and HALs"
            find analysis/work/fs -type f |
              grep -Ei '/(lib|lib64|bin|bin/hw|etc)/' |
              grep -Ei '(crypto|crypt|keymint|keymaster|keystore|gatekeeper|secure|trusty|tee|vold)' |
              sort -u || true
          } > analysis/report/07-module-crypto-analysis.md

      - name: Analyze init, fstab, VINTF and crypto configuration
        run: |
          set -e
          {
            echo "# Beryl recovery configuration analysis"
            echo
            echo "## fstab files"
            find analysis/work/fs -type f \( -iname 'fstab*' -o -path '*/etc/fstab*' \) |
              sort -u |
              while IFS= read -r f; do
                echo
                echo "### $f"
                sed -n '1,260p' "$f" 2>/dev/null || true
              done

            echo
            echo "## init services related to storage and encryption"
            find analysis/work/fs -type f |
              grep -E '/(etc/init|etc)/.*(vold|keymaster|keymint|keystore|gatekeeper|crypt|fscrypt|metadata)' |
              sort -u |
              while IFS= read -r f; do
                echo
                echo "### $f"
                sed -n '1,220p' "$f" 2>/dev/null || true
              done

            echo
            echo "## VINTF declarations"
            find analysis/work/fs -type f |
              grep -E '/etc/vintf/.*\.(xml|manifest|matrix)$' |
              sort -u |
              while IFS= read -r f; do
                echo
                echo "### $f"
                sed -n '1,220p' "$f" 2>/dev/null || true
              done

            echo
            echo "## Crypto-related strings in extracted configuration"
            grep -RniE '(fileencryption|metadata_encryption|keydirectory|wrappedkey|fscrypt|keymint|keymaster|keystore2|gatekeeper|vold|avb)' analysis/work/fs 2>/dev/null | head -n 3000 || true
          } > analysis/report/08-recovery-config-analysis.md

      - name: Static FBE and keymaster inventory
        run: |
          set +e
          {
            echo "# FBE / crypto / keymaster component inventory"
            echo
            echo "Static inventory only; no user encryption keys are extracted."
            echo
            echo "## Candidate files"
            find analysis/images analysis/work -type f -printf '%p\n' 2>/dev/null | grep -Ei '(keymaster|keystore|gatekeeper|cryptfs|fscrypt|vold|tee|trusty|avb|metadata|fstab|ueventd)' | sort -u
            echo
            echo "## Relevant strings"
            for img in boot.img vendor_boot.img init_boot.img; do
              [ -f "analysis/images/$img" ] || continue
              echo
              echo "### $img"
              strings -a "analysis/images/$img" | grep -Ei 'keymaster|keystore2|gatekeeper|vold|fscrypt|fbe|metadata|avb|fstab|mtk|trusty' | head -n 400
            done
          } > analysis/report/02-fbe-keymaster-inventory.txt

      - name: Extract fstab candidates
        run: |
          set +e
          mkdir -p analysis/work/fstab
          for src in analysis/images/boot.img analysis/images/init_boot.img analysis/images/vendor_boot.img; do
            [ -f "$src" ] || continue
            name=$(basename "$src" .img)
            strings -a "$src" | grep -E 'fstab\.|/vendor/etc/fstab|/system/etc/fstab|/odm/etc/fstab|/metadata|/data' > "analysis/work/fstab/$name-strings.txt"
          done
          find analysis/work/fstab -type f -print -exec sed -n '1,300p' {} \; > analysis/report/03-fstab-candidates.txt

      - name: Kernel module inventory
        run: |
          set +e
          {
            echo "# Kernel module inventory"
            echo
            find analysis/images analysis/work -type f \( -name '*.ko' -o -name '*.ko.*' \) -print | sort
            echo
            echo "## Crypto/storage/FBE-related module names"
            find analysis/images analysis/work -type f \( -name '*.ko' -o -name '*.ko.*' \) -printf '%f\n' | grep -Ei '(dm|crypt|fscrypt|f2fs|ext4|ufs|mmc|crypto|key|virtio|storage)' | sort -u
            echo
            echo "## Module strings"
            while IFS= read -r f; do
              echo
              echo "### $f"
              file "$f"
              strings -a "$f" | grep -E 'vermagic=|depends=|parm=' | head -n 30
            done < <(find analysis/images analysis/work -type f \( -name '*.ko' -o -name '*.ko.*' \) -print | sort)
          } > analysis/report/05-kernel-modules.md

      - name: Build recovery recommendations
        run: |
          cat > analysis/report/04-recovery-analysis.md <<'EOF'
# Beryl OFOX16 recovery analysis checklist

## Boot architecture
- Determine boot header version from boot and vendor_boot.
- Determine whether recovery belongs in vendor_boot or another partition.
- Preserve the stock vendor ramdisk when required by the device.
- Confirm A/B and Virtual A/B from evidence rather than assumptions.

## Dynamic partitions
- Inspect super metadata if available.
- Record logical partition names, groups, and sizes.
- Do not hard-code OrangeFox dynamic sizing until verified.

## FBE / decryption
- Identify Android API level and FBE/fscrypt generation.
- Identify metadata partition and fstab encryption flags.
- Identify keymaster, keystore2, gatekeeper and TEE dependencies.
- Identify vendor libraries and kernel modules required by the stock environment.
- Do not enable OF_SKIP_FBE_DECRYPTION unless testing proves decryption is unavailable.
- Do not guess OF_DEFAULT_KEYMASTER_VERSION; derive it from the vendor implementation.

## Kernel modules
- Inventory vendor_dlkm and vendor ramdisk .ko modules.
- Record compression, vermagic and dependencies.
- Focus on filesystem, device-mapper, crypto, storage, F2FS and ext4 modules.
- Determine which modules are actually required in recovery.

## OrangeFox variables to validate
FOX_AB_DEVICE
FOX_VIRTUAL_AB_DEVICE
FOX_VENDOR_BOOT_RECOVERY
FOX_REFERENCE_VENDOR_BOOT_IMAGE
FOX_INSTALLER_VENDOR_BOOT_RAMDISK_INSTALL
OF_FORCE_PREBUILT_KERNEL
OF_SKIP_PREBUILT_MODULES
OF_SKIP_FBE_DECRYPTION
OF_SKIP_FBE_DECRYPTION_SDKVERSION
OF_FBE_METADATA_MOUNT_IGNORE
OF_FORCE_USE_RECOVERY_FSTAB
OF_FORCE_CASEFOLDING
FOX_ADD_API_V36_PREBUILTS

Values should be selected only after reviewing the generated evidence.
EOF

      - name: Package analysis
        run: |
          tar -C analysis -czf beryl-ofox16-stock-analysis.tar.gz report work images
          sha256sum beryl-ofox16-stock-analysis.tar.gz | tee analysis/report/SHA256SUMS

      - name: Publish analysis release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: beryl-ofox16-analysis
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$TAG" \
            beryl-ofox16-stock-analysis.tar.gz \
            analysis/report/01-image-inventory.md \
            analysis/report/02-fbe-keymaster-inventory.txt \
            analysis/report/03-fstab-candidates.txt \
            analysis/report/04-recovery-analysis.md \
            analysis/report/05-kernel-modules.md \
            analysis/report/vendor_ramdisk_files.txt \
            analysis/report/06-filesystem-inventory.md \
            analysis/report/07-module-crypto-analysis.md \
            analysis/report/08-recovery-config-analysis.md \
            --repo "$GITHUB_REPOSITORY" \
            --title "Beryl OFOX16 Stock Recovery Analysis" \
            --notes "Static analysis of stock Beryl Android 16 images for OrangeFox recovery development."
