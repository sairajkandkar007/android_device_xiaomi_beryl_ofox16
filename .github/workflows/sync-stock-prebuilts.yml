name: Sync Stock Recovery Prebuilts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release containing extracted stock images"
        required: true
        default: "stock-images"
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable Git LFS
        run: |
          git lfs install
          git lfs track "prebuilt/vendor_boot.img"
          git lfs track "prebuilt/kernel"
          git lfs track "prebuilt/dtb.img"
          git lfs track "prebuilt/dtbo.img"
          git lfs track "prebuilt/modules/*.ko"
          git lfs track "vendor_sepolicy.cil"
          git lfs track "android.hardware.boot-service.mtk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download stock boot/vendor images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p work
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"             --pattern 'boot.img'             --pattern 'vendor_boot.img'             --pattern 'dtbo.img'             --pattern 'vendor_dlkm.img'             --dir work

      - name: Download split stock vendor image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"             --pattern 'vendor.img.part*'             --dir work
          parts=(work/vendor.img.part*)
          if [ ! -e "${parts[0]}" ]; then
            echo "Split vendor image assets were not found in release $TAG."
            exit 1
          fi
          cat "${parts[@]}" > work/vendor.img

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils lz4 cpio python3
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg work/mkbootimg

      - name: Extract boot, DTB and stock vendor_boot
        run: |
          mkdir -p work/boot work/vendor_boot
          python3 work/mkbootimg/unpack_bootimg.py             --boot_img work/boot.img             --out work/boot
          python3 work/mkbootimg/unpack_bootimg.py             --boot_img work/vendor_boot.img             --out work/vendor_boot

          mkdir -p prebuilt
          cp work/vendor_boot.img prebuilt/vendor_boot.img
          cp work/dtbo.img prebuilt/dtbo.img
          test -s work/boot/kernel
          cp work/boot/kernel prebuilt/kernel

          if [ -f work/boot/dtb ]; then
            cp work/boot/dtb prebuilt/dtb.img
          elif [ -f work/vendor_boot/dtb ]; then
            cp work/vendor_boot/dtb prebuilt/dtb.img
          else
            echo "No DTB was extracted from boot.img or vendor_boot.img."
            exit 1
          fi

      - name: Extract selected vendor DLKM modules
        run: |
          rm -rf work/vendor_dlkm
          mkdir -p work/vendor_dlkm prebuilt/modules

          if command -v extract.erofs >/dev/null 2>&1; then
            extract.erofs work/vendor_dlkm.img work/vendor_dlkm
          else
            fsck.erofs --extract=work/vendor_dlkm work/vendor_dlkm.img
          fi

          while IFS= read -r module; do
            case "$module" in
              ""|"#"*) continue ;;
            esac
            src=$(find work/vendor_dlkm -type f -name "$module" -print -quit || true)
            if [ -z "$src" ]; then
              echo "Missing selected stock module: $module"
              exit 1
            fi
            cp "$src" "prebuilt/modules/$module"
          done < prebuilt/recovery-modules.list

      - name: Extract stock SELinux policy and boot-control HAL
        run: |
          rm -rf work/vendor
          mkdir -p work/vendor

          if command -v extract.erofs >/dev/null 2>&1; then
            extract.erofs work/vendor.img work/vendor
          else
            fsck.erofs --extract=work/vendor work/vendor.img
          fi

          test -s work/vendor/etc/selinux/vendor_sepolicy.cil
          cp work/vendor/etc/selinux/vendor_sepolicy.cil             ./vendor_sepolicy.cil

          bootctl=$(find work/vendor -type f             -name 'android.hardware.boot-service.mtk' -print -quit || true)

          if [ -z "$bootctl" ]; then
            echo "Stock MTK boot-control service binary was not found."
            find work/vendor/bin work/vendor/bin/hw               -maxdepth 1 -type f -iname '*boot*' -print 2>/dev/null || true
            exit 1
          fi

          cp "$bootctl" ./android.hardware.boot-service.mtk

      - name: Verify stock prebuilts
        run: |
          test -s prebuilt/vendor_boot.img
          test -s prebuilt/kernel
          test -s prebuilt/dtb.img
          test -s prebuilt/dtbo.img
          test -s vendor_sepolicy.cil
          test -s android.hardware.boot-service.mtk
          ls -lh             prebuilt/vendor_boot.img             prebuilt/kernel             prebuilt/dtb.img             prebuilt/dtbo.img             prebuilt/modules/*.ko             vendor_sepolicy.cil             android.hardware.boot-service.mtk
          sha256sum             prebuilt/vendor_boot.img             prebuilt/kernel             prebuilt/dtb.img             prebuilt/dtbo.img             prebuilt/modules/*.ko             prebuilt/sepolicy/vendor_sepolicy.cil             prebuilt/bootctrl/android.hardware.boot-service.mtk

      - name: Push extracted recovery prebuilts to device tree
        run: |
          git add .gitattributes prebuilt/

          echo "Files staged for device tree:"
          git status --short

          if git diff --cached --quiet; then
            echo "No extracted prebuilt changes."
            exit 0
          fi

          git commit -m "Add stock Android 16 recovery prebuilts [stock-sync]"

          # Explicitly upload Git LFS objects before updating main.
          git lfs push origin HEAD

          # Push the commit and all extracted recovery prebuilts to main.
          git push origin HEAD:main
