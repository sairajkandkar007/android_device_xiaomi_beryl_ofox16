name: Sync Stock Recovery Prebuilts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release containing extracted stock images"
        required: true
        default: "stock-images"
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable Git LFS
        run: |
          git lfs install
          git lfs track "prebuilt/vendor_boot.img"
          git lfs track "prebuilt/kernel"
          git lfs track "prebuilt/dtb.img"
          git lfs track "prebuilt/dtbs/**"
          git lfs track "prebuilt/dtbo.img"
          git lfs track "prebuilt/modules/**"
          git lfs track "prebuilt/wlan/**"
          git lfs track "prebuilt/touch/**"
          git lfs track "sepolicy/vendor_sepolicy.cil"
          git lfs track "bootctrl/android.hardware.boot-service.mtk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download stock boot/vendor images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p work
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"             --pattern 'boot.img'             --pattern 'vendor_boot.img'             --pattern 'dtbo.img'             --pattern 'vendor_dlkm.img'             --pattern 'system.img'             --dir work

      - name: Download split stock vendor image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"             --pattern 'vendor.img.part*'             --dir work
          parts=(work/vendor.img.part*)
          if [ ! -e "${parts[0]}" ]; then
            echo "Split vendor image assets were not found in release $TAG."
            exit 1
          fi
          cat "${parts[@]}" > work/vendor.img

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils erofsfuse lz4 cpio python3
          for attempt in 1 2 3 4 5; do
            rm -rf work/mkbootimg
            if git -c http.version=HTTP/1.1 clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg work/mkbootimg; then
              break
            fi
            echo "mkbootimg clone attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          test -f work/mkbootimg/unpack_bootimg.py

      - name: Configure EROFS extraction helper
        run: |
          cat > work/extract_erofs.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          image="$1"
          out="$2"
          rm -rf "$out"
          mkdir -p "$out"
          mountpoint="$(mktemp -d)"
          cleanup() {
            fusermount -u "$mountpoint" >/dev/null 2>&1 || true
            rm -rf "$mountpoint"
          }
          trap cleanup EXIT
          erofsfuse "$image" "$mountpoint"
          for _ in $(seq 1 20); do
            if mountpoint -q "$mountpoint"; then
              break
            fi
            sleep 1
          done
          mountpoint -q "$mountpoint"
          cp -a "$mountpoint/." "$out/"
          EOF
          chmod +x work/extract_erofs.sh

      - name: Extract boot, DTB and stock vendor_boot
        run: |
          mkdir -p work/boot work/vendor_boot
          python3 work/mkbootimg/unpack_bootimg.py             --boot_img work/boot.img             --out work/boot
          python3 work/mkbootimg/unpack_bootimg.py             --boot_img work/vendor_boot.img             --out work/vendor_boot

          mkdir -p prebuilt
          cp work/vendor_boot.img prebuilt/vendor_boot.img
          cp work/dtbo.img prebuilt/dtbo.img
          test -s work/boot/kernel
          cp work/boot/kernel prebuilt/kernel

          if [ -f work/boot/dtb ]; then
            cp work/boot/dtb prebuilt/dtb.img
          elif [ -f work/vendor_boot/dtb ]; then
            cp work/vendor_boot/dtb prebuilt/dtb.img
          else
            echo "No DTB was extracted from boot.img or vendor_boot.img."
            exit 1
          fi

      - name: Materialize stock DTB for OrangeFox
        run: |
          set -euo pipefail
          mkdir -p prebuilt/dtbs
          test -s prebuilt/dtb.img
          cp -f prebuilt/dtb.img prebuilt/dtbs/beryl.dtb
          ls -lh prebuilt/dtbs/beryl.dtb

      - name: Extract selected vendor DLKM modules
        run: |
          rm -rf work/vendor_dlkm
          mkdir -p work/vendor_dlkm prebuilt/modules sepolicy bootctrl

          work/extract_erofs.sh work/vendor_dlkm.img work/vendor_dlkm

          while IFS= read -r module; do
            case "$module" in
              ""|"#"*) continue ;;
            esac
            src=$(find work/vendor_dlkm -type f -name "$module" -print -quit || true)
            if [ -z "$src" ]; then
              echo "Missing selected stock module: $module"
              exit 1
            fi
            cp "$src" "prebuilt/modules/$module"
          done < prebuilt/recovery-modules.list

      - name: Extract stock WLAN support
        run: |
          set -euo pipefail
          rm -rf prebuilt/wlan
          mkdir -p prebuilt/wlan

          # The WLAN payload is sourced from the exact stock vendor/vendor_dlkm
          # images. Extract vendor here because the dedicated vendor extraction
          # step runs later in this workflow.
          if [ ! -d work/vendor/etc ]; then
            rm -rf work/vendor
            mkdir -p work/vendor
            work/extract_erofs.sh work/vendor.img work/vendor
          fi

          test -d work/vendor
          test -d work/vendor_dlkm

          # Exact Beryl WLAN firmware/config files observed in the device vendor tree.
          for rel in \
            vendor/firmware/WIFI_RAM_CODE_soc2_2_1b_1.bin \
            vendor/firmware/WIFI_RAM_CODE_soc2_2_1c_1.bin \
            vendor/firmware/soc2_2_ram_wifi_1b_1_hdr.bin \
            vendor/firmware/soc2_2_ram_wifi_1c_1_hdr.bin \
            vendor/firmware/WMT_SOC.cfg \
            vendor/firmware/wifi.cfg; do
            if [ -f "work/vendor/$rel" ]; then
              mkdir -p "prebuilt/wlan/$(dirname "$rel")"
              cp -a "work/vendor/$rel" "prebuilt/wlan/$rel"
            fi
          done

          # WLAN-related init/userspace components are copied only when present
          # in the exact Android 16 stock vendor image.
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            rel=${src#work/vendor/}
            mkdir -p "prebuilt/wlan/$(dirname "$rel")"
            cp -a "$src" "prebuilt/wlan/$rel"
          done < <(find work/vendor -type f \
            \( -path '*/etc/init/*wlan*.rc' -o \
               -path '*/etc/init/*wmt*.rc' -o \
               -path '*/etc/init/*conninfra*.rc' -o \
               -path '*/bin/*wlan*' -o \
               -path '*/bin/*wmt*' -o \
               -path '*/bin/*conninfra*' -o \
               -path '*/bin/hw/*wifi*' -o \
               -path '*/bin/hw/*wlan*' -o \
               -path '*/lib*/*libwifi*' -o \
               -path '*/lib*/*libwlan*' -o \
               -path '*/lib*/*wifi*.so' \) -print 2>/dev/null)

          # Preserve the exact stock WLAN module inventory. Do not guess module
          # names; recovery-modules.list remains the authoritative selected list.
          find work/vendor_dlkm -type f -name '*.ko' \
            \( -iname '*wlan*' -o -iname '*wifi*' -o -iname '*conninfra*' -o -iname '*wmt*' \) \
            -print 2>/dev/null | while IFS= read -r src; do
              cp -a "$src" prebuilt/wlan/$(basename "$src")
          done

          find prebuilt/wlan -type f -printf '%P\n' | sort > prebuilt/wlan/manifest.txt
          echo "Stock WLAN payload:"
          cat prebuilt/wlan/manifest.txt
          if [ -s prebuilt/wlan/manifest.txt ]; then
            echo "Stock WLAN payload extracted."
          else
            echo "No WLAN payload found in the stock images; continuing without WLAN support."
          fi

      - name: Search and copy stock decryption support
        run: |
          rm -rf prebuilt/decryption work/system work/key_service_scan.txt work/key_service_deps.txt
          mkdir -p prebuilt/decryption/vendor prebuilt/decryption/system prebuilt/decryption/config

          # Extract vendor here as well because this step runs before the
          # dedicated SELinux/boot-control vendor extraction step below.
          if [ ! -f work/vendor/etc/selinux/vendor_sepolicy.cil ]; then
            rm -rf work/vendor
            mkdir -p work/vendor
            work/extract_erofs.sh work/vendor.img work/vendor
          fi

          # Vendor-side Android FBE/KeyMint/Gatekeeper components.
          find work/vendor -type f -regextype posix-extended \
            -iregex '.*(keymint|keymaster|gatekeeper|keystore2|vold|fscrypt|fbe|metadata.*encrypt|cryptfs|wrappedkey|secureclock|sharedsecret).*' \
            -print0 2>/dev/null | while IFS= read -r -d '' src; do
              rel=${src#work/vendor/}
              mkdir -p "prebuilt/decryption/vendor/$(dirname "$rel")"
              cp -a "$src" "prebuilt/decryption/vendor/$rel"
            done

          # System-side vold/keystore2/fscrypt/FBE userspace components.
          if [ -f work/system.img ]; then
            work/extract_erofs.sh work/system.img work/system
          fi

          if [ -d work/system ]; then
            find work/system -type f -regextype posix-extended \
              -iregex '.*(keymint|keymaster|gatekeeper|keystore2|vold|fscrypt|fbe|metadata.*encrypt|cryptfs|wrappedkey|secureclock|sharedsecret).*' \
              -print0 2>/dev/null | while IFS= read -r -d '' src; do
                rel=${src#work/system/}
                mkdir -p "prebuilt/decryption/system/$(dirname "$rel")"
                cp -a "$src" "prebuilt/decryption/system/$rel"
              done
          fi

          # Keep only recovery-relevant filesystem/encryption configuration.
          find work/vendor/etc -type f \(             -name 'fstab*' -o -name 'vold*.rc' -o -name '*fscrypt*' -o             -name '*keymint*.xml' -o -name '*keymaster*.xml' -o             -name '*gatekeeper*.xml' -o -name '*keystore*.xml'           \) -print0 2>/dev/null | while IFS= read -r -d '' src; do
            rel=${src#work/vendor/etc/}
            mkdir -p "prebuilt/decryption/config/fstab/$(dirname "$rel")"
            cp -a "$src" "prebuilt/decryption/config/fstab/$rel"
          done

          if [ -d work/system/etc ]; then
            find work/system/etc -type f \(               -name 'fstab*' -o -name 'vold*.rc' -o -name '*fscrypt*' -o               -name '*keymint*.xml' -o -name '*keymaster*.xml' -o               -name '*gatekeeper*.xml' -o -name '*keystore*.xml'             \) -print0 2>/dev/null | while IFS= read -r -d '' src; do
              rel=${src#work/system/etc/}
              mkdir -p "prebuilt/decryption/config/fstab/$(dirname "$rel")"
              cp -a "$src" "prebuilt/decryption/config/fstab/$rel"
            done
          fi

          # Scan vendor/system init scripts for the actual KeyMint, Keymaster,
          # Gatekeeper and TEE services. Do not guess service binary names:
          # parse the stock .rc "service <name> <binary>" declarations and
          # copy the referenced executable when it exists.
          mkdir -p prebuilt/decryption/services/init/vendor prebuilt/decryption/services/init/system
          : > work/key_service_scan.txt

          # Only parse explicitly relevant security/crypto init files.
          # Do not collect unrelated vendor services into the recovery payload.
          while IFS= read -r rc; do
            case "$rc" in
              *keymint*.rc|*keymaster*.rc|*gatekeeper*.rc|*tee-supplicant*.rc|*keystore*.rc|*vold*.rc)
                rel=${rc#work/vendor/etc/init/}
                mkdir -p prebuilt/decryption/config/vendor_init
                cp -a "$rc" "prebuilt/decryption/config/vendor_init/$rel"
                printf 'VENDOR_RC %s\n' "$rel" >> work/key_service_scan.txt

                while read -r service_name service_bin _; do
                  [ -n "$service_name" ] || continue
                  case "$service_bin" in
                    /vendor/*|/system/*|/system_ext/*|/product/*)
                      src="work$service_bin"
                      if [ -f "$src" ]; then
                        root_rel=${service_bin#/}
                        mkdir -p "prebuilt/decryption/config/service_bins/$(dirname "$root_rel")"
                        cp -a "$src" "prebuilt/decryption/config/service_bins/$root_rel"
                        printf 'SERVICE %s %s\n' "$service_name" "$service_bin" >> work/key_service_scan.txt
                      else
                        printf 'MISSING_SERVICE_BINARY %s %s\n' "$service_name" "$service_bin" >> work/key_service_scan.txt
                      fi
                      ;;
                  esac
                done < <(awk '$1=="service" && NF>=3 {print $2, $3}' "$rc" 2>/dev/null)
                ;;
            esac
          done < <(find work/vendor/etc/init -type f -name '*.rc' -print 2>/dev/null)

          if [ -d work/system/etc/init ]; then
            while IFS= read -r rc; do
              case "$rc" in
                *keymint*.rc|*keymaster*.rc|*gatekeeper*.rc|*tee-supplicant*.rc|*keystore*.rc|*vold*.rc)
                  rel=${rc#work/system/etc/init/}
                  mkdir -p "prebuilt/decryption/services/init/system/$(dirname "$rel")"
                  cp -a "$rc" "prebuilt/decryption/services/init/system/$rel"
                  printf 'SYSTEM_RC %s\n' "$rel" >> work/key_service_scan.txt
                  ;;
              esac
            done < <(find work/system/etc/init -type f -name '*.rc' -print 2>/dev/null)
          fi

          echo "=== KeyMint/Keymaster/Gatekeeper/TEE service scan ==="
          cat work/key_service_scan.txt 2>/dev/null || true
          cp work/key_service_scan.txt prebuilt/decryption/services/key-service-scan.txt

          echo "=== Discovered key-service payload ==="
          find prebuilt/decryption/services/init/vendor \
               prebuilt/decryption/services/init/system \
               prebuilt/decryption/services/bins \
               -type f -print 2>/dev/null | sort || true

          echo "=== Resolve ELF dependencies of discovered key services ==="
          mkdir -p prebuilt/decryption/services/deps
          : > work/key_service_deps.txt

          # Follow DT_NEEDED recursively from the exact stock service binaries.
          # This discovers the real Beryl MITEE/KeyMint/Gatekeeper dependency
          # chain instead of copying files based only on their filenames.
          #
          # Dependencies are resolved against the extracted stock /vendor,
          # /system, /system_ext and /product trees. Nothing is copied from Klee
          # or another device.
          if command -v readelf >/dev/null 2>&1; then
            declare -A seen_deps=()
            resolve_elf() {
              local src="$1"
              local depth="${2:-0}"
              [ -f "$src" ] || return 0
              [ "$depth" -le 20 ] || return 0

              local key="${src#work/}"
              if [ -n "${seen_deps[$key]:-}" ]; then
                return 0
              fi
              seen_deps["$key"]=1

              local root_rel="${src#work/}"
              local out="prebuilt/decryption/services/deps/$root_rel"
              mkdir -p "$(dirname "$out")"
              cp -a "$src" "$out"

              local dep
              while IFS= read -r dep; do
                [ -n "$dep" ] || continue
                case "$dep" in
                  /*)
                    ;;
                  *)
                    continue
                    ;;
                esac

                local candidate=""
                for base in work/vendor work/system work/system_ext work/product; do
                  if [ -f "$base$dep" ]; then
                    candidate="$base$dep"
                    break
                  fi
                done

                if [ -z "$candidate" ]; then
                  printf 'MISSING_DEP %s %s\n' "$root_rel" "$dep" >> work/key_service_deps.txt
                  continue
                fi

                printf 'DEP %s -> %s\n' "$root_rel" "${candidate#work/}" >> work/key_service_deps.txt
                resolve_elf "$candidate" "$((depth + 1))"
              done < <(
                readelf -d "$src" 2>/dev/null |
                  awk '/NEEDED/ {
                    gsub(/[][]/, "", $NF)
                    print $NF
                  }' |
                  sort -u
              )
            }

            while IFS= read -r service_bin; do
              [ -n "$service_bin" ] || continue
              case "$service_bin" in
                /vendor/*|/system/*|/system_ext/*|/product/*)
                  src="work$service_bin"
                  if [ -f "$src" ]; then
                    resolve_elf "$src"
                  fi
                  ;;
              esac
            done < <(
              awk '$1=="SERVICE" {print $3}' work/key_service_scan.txt 2>/dev/null |
                sort -u
            )
          else
            echo "readelf is unavailable; skipping ELF dependency resolution."
          fi

          printf '%s\n'             "ELF dependency scan complete."             "Resolved payload:"             > prebuilt/decryption/services/deps/README.txt
          find prebuilt/decryption/services/deps -type f             -printf '%P\n' | sort >> prebuilt/decryption/services/deps/README.txt

          cp work/key_service_deps.txt prebuilt/decryption/services/key-service-deps.txt
          echo "=== Key-service ELF dependency scan ==="
          cat prebuilt/decryption/services/key-service-deps.txt 2>/dev/null || true

          # Search policy for decryption-related domains/rules; retain the stock
          # policy files as evidence rather than modifying policy automatically.
          find work/vendor/etc/selinux -type f \
            -regextype posix-extended \
            -iregex '.*(keystore|keymint|gatekeeper|vold|fscrypt|crypt|metadata).*' \
            -print0 2>/dev/null | while IFS= read -r -d '' src; do
              rel=${src#work/vendor/etc/selinux/}
              mkdir -p "prebuilt/decryption/config/selinux/$(dirname "$rel")"
              cp -a "$src" "prebuilt/decryption/config/selinux/$rel"
            done

          find prebuilt/decryption -type f -printf '%P\n' | sort > prebuilt/decryption/manifest.txt

          echo "Decryption-related stock payload:"
          cat prebuilt/decryption/manifest.txt
          test -s prebuilt/decryption/manifest.txt

      - name: Extract stock SELinux policy and boot-control HAL
        run: |
          rm -rf work/vendor
          mkdir -p work/vendor

          work/extract_erofs.sh work/vendor.img work/vendor

          test -s work/vendor/etc/selinux/vendor_sepolicy.cil
          cp work/vendor/etc/selinux/vendor_sepolicy.cil             sepolicy/vendor_sepolicy.cil

          bootctl=$(find work/vendor -type f             -name 'android.hardware.boot-service.mtk' -print -quit || true)

          if [ -z "$bootctl" ]; then
            echo "Stock MTK boot-control service binary was not found."
            find work/vendor/bin work/vendor/bin/hw               -maxdepth 1 -type f -iname '*boot*' -print 2>/dev/null || true
            exit 1
          fi

          cp "$bootctl" bootctrl/android.hardware.boot-service.mtk

      - name: Verify stock prebuilts
        run: |
          # WLAN/touch payloads are optional until their exact stock userspace
          # and firmware/module dependencies are identified. Never fail the
          # stock sync merely because those optional directories are absent.
          mkdir -p prebuilt/wlan prebuilt/touch

          test -s prebuilt/vendor_boot.img
          test -s prebuilt/kernel
          test -s prebuilt/dtb.img
          test -s prebuilt/dtbo.img
          test -s sepolicy/vendor_sepolicy.cil
          test -s bootctrl/android.hardware.boot-service.mtk
          find prebuilt/modules -type f -name '*.ko' -print | sort
          find prebuilt/wlan -type f -print | sort
          find prebuilt/touch -type f -print | sort
          ls -lh prebuilt/vendor_boot.img prebuilt/kernel prebuilt/dtb.img prebuilt/dtbo.img sepolicy/vendor_sepolicy.cil bootctrl/android.hardware.boot-service.mtk
          sha256sum prebuilt/vendor_boot.img prebuilt/kernel prebuilt/dtb.img prebuilt/dtbo.img sepolicy/vendor_sepolicy.cil bootctrl/android.hardware.boot-service.mtk
          test "$(find prebuilt/modules -type f -name '*.ko' | wc -l)" -gt 0

          if [ -s prebuilt/wlan/modules.list ]; then
            echo "Stock WLAN module manifest found."
          else
            echo "No stock WLAN module manifest was extracted; continuing."
          fi

          if [ -s prebuilt/touch/modules.list ]; then
            echo "Stock touch module manifest found."
          else
            echo "No stock touch module manifest was extracted; continuing."
          fi

      - name: Push extracted recovery prebuilts to device tree
        run: |
          git add .gitattributes prebuilt/ sepolicy/ bootctrl/

          echo "Files staged for device tree:"
          git status --short

          if git diff --cached --quiet; then
            echo "No extracted prebuilt changes."
            exit 0
          fi

          git commit -m "Add stock Android 16 recovery prebuilts [stock-sync]"

          # Explicitly upload Git LFS objects before updating main.
          git lfs push origin HEAD

          # Push the commit and all extracted recovery prebuilts to main.
          git push origin HEAD:main
