name: Sync Stock Recovery Prebuilts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release containing extracted stock images"
        required: true
        default: "stock-images"
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable Git LFS
        run: |
          git lfs install
          git lfs track "prebuilt/vendor_boot.img"
          git lfs track "prebuilt/kernel"
          git lfs track "prebuilt/dtb.img"
          git lfs track "prebuilt/dtbo.img"
          git lfs track "prebuilt/modules/**"
          git lfs track "prebuilt/wlan/**"
          git lfs track "prebuilt/touch/**"
          git lfs track "sepolicy/vendor_sepolicy.cil"
          git lfs track "bootctrl/android.hardware.boot-service.mtk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download stock boot/vendor images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p work
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"             --pattern 'boot.img'             --pattern 'vendor_boot.img'             --pattern 'dtbo.img'             --pattern 'vendor_dlkm.img'             --pattern 'system.img'             --dir work

      - name: Download split stock vendor image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY"             --pattern 'vendor.img.part*'             --dir work
          parts=(work/vendor.img.part*)
          if [ ! -e "${parts[0]}" ]; then
            echo "Split vendor image assets were not found in release $TAG."
            exit 1
          fi
          cat "${parts[@]}" > work/vendor.img

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils erofsfuse lz4 cpio python3
          for attempt in 1 2 3 4 5; do
            rm -rf work/mkbootimg
            if git -c http.version=HTTP/1.1 clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg work/mkbootimg; then
              break
            fi
            echo "mkbootimg clone attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          test -f work/mkbootimg/unpack_bootimg.py

      - name: Configure EROFS extraction helper
        run: |
          cat > work/extract_erofs.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          image="$1"
          out="$2"
          rm -rf "$out"
          mkdir -p "$out"
          mountpoint="$(mktemp -d)"
          cleanup() {
            fusermount -u "$mountpoint" >/dev/null 2>&1 || true
            rm -rf "$mountpoint"
          }
          trap cleanup EXIT
          erofsfuse "$image" "$mountpoint"
          for _ in $(seq 1 20); do
            if mountpoint -q "$mountpoint"; then
              break
            fi
            sleep 1
          done
          mountpoint -q "$mountpoint"
          cp -a "$mountpoint/." "$out/"
          EOF
          chmod +x work/extract_erofs.sh

      - name: Extract boot, DTB and stock vendor_boot
        run: |
          mkdir -p work/boot work/vendor_boot
          python3 work/mkbootimg/unpack_bootimg.py             --boot_img work/boot.img             --out work/boot
          python3 work/mkbootimg/unpack_bootimg.py             --boot_img work/vendor_boot.img             --out work/vendor_boot

          mkdir -p prebuilt
          cp work/vendor_boot.img prebuilt/vendor_boot.img
          cp work/dtbo.img prebuilt/dtbo.img
          test -s work/boot/kernel
          cp work/boot/kernel prebuilt/kernel

          if [ -f work/boot/dtb ]; then
            cp work/boot/dtb prebuilt/dtb.img
          elif [ -f work/vendor_boot/dtb ]; then
            cp work/vendor_boot/dtb prebuilt/dtb.img
          else
            echo "No DTB was extracted from boot.img or vendor_boot.img."
            exit 1
          fi

      - name: Extract selected vendor DLKM modules
        run: |
          rm -rf work/vendor_dlkm
          mkdir -p work/vendor_dlkm prebuilt/modules sepolicy bootctrl

          work/extract_erofs.sh work/vendor_dlkm.img work/vendor_dlkm

          while IFS= read -r module; do
            case "$module" in
              ""|"#"*) continue ;;
            esac
            src=$(find work/vendor_dlkm -type f -name "$module" -print -quit || true)
            if [ -z "$src" ]; then
              echo "Missing selected stock module: $module"
              exit 1
            fi
            cp "$src" "prebuilt/modules/$module"
          done < prebuilt/recovery-modules.list

      - name: Search and copy stock decryption support
        run: |
          rm -rf prebuilt/decryption work/system
          mkdir -p prebuilt/decryption/vendor prebuilt/decryption/system prebuilt/decryption/config

          # Vendor-side Android FBE/KeyMint/Gatekeeper components.
          find work/vendor -type f -regextype posix-extended \
            -iregex '.*(keymint|keymaster|gatekeeper|keystore2|vold|fscrypt|fbe|metadata.*encrypt|cryptfs|wrappedkey|secureclock|sharedsecret).*' \
            -print0 2>/dev/null | while IFS= read -r -d '' src; do
              rel=${src#work/vendor/}
              mkdir -p "prebuilt/decryption/vendor/$(dirname "$rel")"
              cp -a "$src" "prebuilt/decryption/vendor/$rel"
            done

          # System-side vold/keystore2/fscrypt/FBE userspace components.
          if [ -f work/system.img ]; then
            work/extract_erofs.sh work/system.img work/system
          fi

          if [ -d work/system ]; then
            find work/system -type f -regextype posix-extended \
              -iregex '.*(keymint|keymaster|gatekeeper|keystore2|vold|fscrypt|fbe|metadata.*encrypt|cryptfs|wrappedkey|secureclock|sharedsecret).*' \
              -print0 2>/dev/null | while IFS= read -r -d '' src; do
                rel=${src#work/system/}
                mkdir -p "prebuilt/decryption/system/$(dirname "$rel")"
                cp -a "$src" "prebuilt/decryption/system/$rel"
              done
          fi

          # Recovery-relevant fstab/configuration entries containing encryption,
          # metadata, key-directory, fscrypt or KeyMint settings.
          find work/vendor/etc -type f \
            -regextype posix-extended \
            -iregex '.*(fstab|vold|crypt|fscrypt|keymint|keymaster|gatekeeper|keystore|metadata).*' \
            -print0 2>/dev/null | while IFS= read -r -d '' src; do
              rel=${src#work/vendor/etc/}
              mkdir -p "prebuilt/decryption/config/$(dirname "$rel")"
              cp -a "$src" "prebuilt/decryption/config/$rel"
            done

          # Copy matching system configuration as well.
          if [ -d work/system/etc ]; then
            find work/system/etc -type f \
              -regextype posix-extended \
              -iregex '.*(fstab|vold|crypt|fscrypt|keymint|keymaster|gatekeeper|keystore|metadata).*' \
              -print0 2>/dev/null | while IFS= read -r -d '' src; do
                rel=${src#work/system/etc/}
                mkdir -p "prebuilt/decryption/config/system/$(dirname "$rel")"
                cp -a "$src" "prebuilt/decryption/config/system/$rel"
              done
          fi

          # Search policy for decryption-related domains/rules; retain the stock
          # policy files as evidence rather than modifying policy automatically.
          find work/vendor/etc/selinux -type f \
            -regextype posix-extended \
            -iregex '.*(keystore|keymint|gatekeeper|vold|fscrypt|crypt|metadata).*' \
            -print0 2>/dev/null | while IFS= read -r -d '' src; do
              rel=${src#work/vendor/etc/selinux/}
              mkdir -p "prebuilt/decryption/config/selinux/$(dirname "$rel")"
              cp -a "$src" "prebuilt/decryption/config/selinux/$rel"
            done

          find prebuilt/decryption -type f -printf '%P\n' | sort > prebuilt/decryption/manifest.txt

          echo "Decryption-related stock payload:"
          cat prebuilt/decryption/manifest.txt
          test -s prebuilt/decryption/manifest.txt

      - name: Extract stock SELinux policy and boot-control HAL
        run: |
          rm -rf work/vendor
          mkdir -p work/vendor

          work/extract_erofs.sh work/vendor.img work/vendor

          test -s work/vendor/etc/selinux/vendor_sepolicy.cil
          cp work/vendor/etc/selinux/vendor_sepolicy.cil             sepolicy/vendor_sepolicy.cil

          bootctl=$(find work/vendor -type f             -name 'android.hardware.boot-service.mtk' -print -quit || true)

          if [ -z "$bootctl" ]; then
            echo "Stock MTK boot-control service binary was not found."
            find work/vendor/bin work/vendor/bin/hw               -maxdepth 1 -type f -iname '*boot*' -print 2>/dev/null || true
            exit 1
          fi

          cp "$bootctl" bootctrl/android.hardware.boot-service.mtk

      - name: Verify stock prebuilts
        run: |
          test -s prebuilt/vendor_boot.img
          test -s prebuilt/kernel
          test -s prebuilt/dtb.img
          test -s prebuilt/dtbo.img
          test -s sepolicy/vendor_sepolicy.cil
          test -s bootctrl/android.hardware.boot-service.mtk
          find prebuilt/modules -type f -name '*.ko' -print | sort
          find prebuilt/wlan -type f -print | sort
          find prebuilt/touch -type f -print | sort
          ls -lh prebuilt/vendor_boot.img prebuilt/kernel prebuilt/dtb.img prebuilt/dtbo.img sepolicy/vendor_sepolicy.cil bootctrl/android.hardware.boot-service.mtk
          sha256sum prebuilt/vendor_boot.img prebuilt/kernel prebuilt/dtb.img prebuilt/dtbo.img sepolicy/vendor_sepolicy.cil bootctrl/android.hardware.boot-service.mtk
          test "$(find prebuilt/modules -type f -name '*.ko' | wc -l)" -gt 0
          test -s prebuilt/wlan/modules.list
          test -s prebuilt/touch/modules.list

      - name: Push extracted recovery prebuilts to device tree
        run: |
          git add .gitattributes prebuilt/ sepolicy/ bootctrl/

          echo "Files staged for device tree:"
          git status --short

          if git diff --cached --quiet; then
            echo "No extracted prebuilt changes."
            exit 0
          fi

          git commit -m "Add stock Android 16 recovery prebuilts [stock-sync]"

          # Explicitly upload Git LFS objects before updating main.
          git lfs push origin HEAD

          # Push the commit and all extracted recovery prebuilts to main.
          git push origin HEAD:main
