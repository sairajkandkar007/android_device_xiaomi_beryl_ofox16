name: Build OrangeFox Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orangefox-${{ github.ref }}
  cancel-in-progress: true

env:
  FOX_BRANCH: "16.0"
  FOX_ROOT: ${{ github.workspace }}/fox_16.0
  DEVICE_PATH: device/xiaomi/beryl
  LUNCH_TARGET: fox_beryl-ap2a-eng
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Maximize build space
        shell: bash
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/lib/node_modules
          sudo apt-get clean
          if command -v docker >/dev/null 2>&1; then sudo docker system prune -af || true; fi
          df -h

      - name: Configure swap and zram
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y zram-tools util-linux
          if ! sudo swapon --show --noheadings | grep -q .; then
            sudo fallocate -l 12G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon -p 10 /swapfile
          fi
          if command -v zramctl >/dev/null 2>&1 && sudo modprobe zram num_devices=1 2>/dev/null; then
            ZRAM_DEV="$(sudo zramctl --find --size 8G --algorithm lz4 2>/dev/null || true)"
            if [ -n "$ZRAM_DEV" ]; then
              sudo mkswap "$ZRAM_DEV"
              sudo swapon -p 100 "$ZRAM_DEV"
            fi
          fi
          free -h
          sudo swapon --show
          sudo zramctl || true

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y aria2 bc bison build-essential ccache flex gperf lib32ncurses-dev lib32readline-dev lib32z1-dev lz4 libncurses-dev libssl-dev libxml2-utils rsync schedtool unzip zip zlib1g-dev

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ofox16-${{ runner.os }}-${{ hashFiles('BoardConfig.mk', 'device.mk', 'fox_beryl.mk', 'AndroidProducts.mk') }}
          restore-keys: |
            ccache-ofox16-${{ runner.os }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$CCACHE_DIR"
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"
          export CCACHE_DIR="$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=compression=true
          ccache -M 20G
          ccache -z
          {
            echo "USE_CCACHE=1"
            echo "CCACHE_EXEC=$CCACHE_EXEC"
            echo "CCACHE_DIR=$CCACHE_DIR"
          } >> "$GITHUB_ENV"
          ccache -s

      - name: Sync OrangeFox 16.0
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$FOX_ROOT" "$RUNNER_TEMP/orangefox-sync"
          mkdir -p "$FOX_ROOT"
          git clone --depth=1 --filter=blob:none --single-branch --branch master \
            https://gitlab.com/OrangeFox/sync.git "$RUNNER_TEMP/orangefox-sync"
          cd "$RUNNER_TEMP/orangefox-sync"
          # Official OrangeFox syntax: branch + absolute path.
          # The helper performs the repo initialization/sync itself.
          ./orangefox_sync.sh --branch "$FOX_BRANCH" --path "$FOX_ROOT"
      - name: Update built-in Magisk installer
        shell: bash
        run: |
          set -euxo pipefail
          MAGISK_VERSION="30.7"
          MAGISK_DIR="$FOX_ROOT/prebuilts/magisk"
          MAGISK_APK="$MAGISK_DIR/Magisk-v${MAGISK_VERSION}.apk"
          MAGISK_ZIP="$MAGISK_DIR/Magisk-v${MAGISK_VERSION}.zip"
          mkdir -p "$MAGISK_DIR"
          curl -fL --retry 5 --retry-delay 3 \
            -o "$MAGISK_APK" \
            "https://github.com/topjohnwu/Magisk/releases/download/v${MAGISK_VERSION}/Magisk-v${MAGISK_VERSION}.apk"
          cp -f "$MAGISK_APK" "$MAGISK_ZIP"
          test -s "$MAGISK_ZIP"
          unzip -tq "$MAGISK_ZIP" >/dev/null
          echo "FOX_USE_SPECIFIC_MAGISK_ZIP=$MAGISK_ZIP" >> "$GITHUB_ENV"
          echo "Using official Magisk v${MAGISK_VERSION} installer: $MAGISK_ZIP"

      - name: Add device tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$FOX_ROOT/$DEVICE_PATH"
          rsync -a --exclude='.git/' --exclude='.github/' "$GITHUB_WORKSPACE/" "$FOX_ROOT/$DEVICE_PATH/"
          test -f "$FOX_ROOT/$DEVICE_PATH/AndroidProducts.mk"
          test -f "$FOX_ROOT/$DEVICE_PATH/fox_beryl.mk"
          test -f "$FOX_ROOT/$DEVICE_PATH/BoardConfig.mk"

      - name: Verify lunch target
        working-directory: ${{ env.FOX_ROOT }}
        shell: bash
        run: |
          set -euxo pipefail
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          test "$TARGET_PRODUCT" = "fox_beryl"
          test "$TARGET_BUILD_VARIANT" = "eng"

      - name: Build recovery
        working-directory: ${{ env.FOX_ROOT }}
        shell: bash
        run: |
          set -euxo pipefail
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          export FOX_USE_SPECIFIC_MAGISK_ZIP="${{ env.FOX_USE_SPECIFIC_MAGISK_ZIP }}"
          echo "FOX_USE_SPECIFIC_MAGISK_ZIP=$FOX_USE_SPECIFIC_MAGISK_ZIP"
          mka adbd recoveryimage -j"$(nproc --all)"

      - name: Merge OrangeFox recovery ramdisk into stock vendor_boot
        working-directory: ${{ env.FOX_ROOT }}
        shell: bash
        run: |
          set -euxo pipefail
          DEVICE_TREE="$GITHUB_WORKSPACE"
          OUT="out/target/product/beryl"
          WORK="$RUNNER_TEMP/vendorboot-merge"
          MKBOOTIMG="$RUNNER_TEMP/mkbootimg"

          test -s "$OUT/recovery.img"
          test -s "$DEVICE_TREE/prebuilt/vendor_boot.img"
          rm -rf "$WORK" "$MKBOOTIMG"
          mkdir -p "$WORK/built" "$WORK/stock" "$WORK/new"

          for attempt in 1 2 3 4 5; do
            if git -c http.version=HTTP/1.1 clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg "$MKBOOTIMG"; then break; fi
            rm -rf "$MKBOOTIMG"
            sleep 5
          done
          test -f "$MKBOOTIMG/unpack_bootimg.py"
          test -f "$MKBOOTIMG/mkbootimg.py"

          # Extract the ramdisk produced by OrangeFox.
          python3 "$MKBOOTIMG/unpack_bootimg.py" --boot_img "$OUT/recovery.img" --out "$WORK/built"
          test -s "$WORK/built/ramdisk"

          # Extract every stock vendor_boot v4 fragment and metadata.
          python3 "$MKBOOTIMG/unpack_bootimg.py" --boot_img "$DEVICE_TREE/prebuilt/vendor_boot.img" --out "$WORK/stock"
          test -s "$WORK/stock/vendor_ramdisk00"
          test -s "$WORK/stock/vendor_ramdisk01"
          test -s "$WORK/stock/dtb"
          test -s "$WORK/stock/bootconfig"

          # Replace ONLY the dedicated recovery fragment.
          cp -f "$WORK/built/ramdisk" "$WORK/stock/vendor_ramdisk01"

          # Generate the exact AOSP mkbootimg argument list from stock.
          # This preserves v4 fragment types/names, board IDs, addresses,
          # ordering, page size, DTB and vendor_bootconfig.
          python3 "$MKBOOTIMG/unpack_bootimg.py" --boot_img "$DEVICE_TREE/prebuilt/vendor_boot.img" --out "$WORK/stock" --format=mkbootimg -0 > "$WORK/mkbootimg_args"

          declare -a MKBOOTIMG_ARGS=()
          while IFS= read -r -d "" ARG; do
            MKBOOTIMG_ARGS+=("$ARG")
          done < "$WORK/mkbootimg_args"

          # The stock argument list points vendor_ramdisk01 to the extracted
          # stock recovery file. That path now contains the OrangeFox ramdisk.
          found_recovery=0
          for i in "${!MKBOOTIMG_ARGS[@]}"; do
            if [ "${MKBOOTIMG_ARGS[$i]}" = "$WORK/stock/vendor_ramdisk01" ]; then
              found_recovery=1
              break
            fi
          done
          test "$found_recovery" = 1

          python3 "$MKBOOTIMG/mkbootimg.py" "${MKBOOTIMG_ARGS[@]}" --vendor_boot "$WORK/new/vendor_boot.img"
          test -s "$WORK/new/vendor_boot.img"

          SIZE=$(stat -c "%s" "$WORK/new/vendor_boot.img")
          MAX=$((64 * 1024 * 1024))
          echo "Merged vendor_boot size: $SIZE bytes"
          test "$SIZE" -le "$MAX"

          # Validate the resulting vendor_boot v4 and byte-level preservation.
          python3 "$MKBOOTIMG/unpack_bootimg.py" --boot_img "$WORK/new/vendor_boot.img" --out "$WORK/verify"
          test "$(cat "$WORK/verify/header_version")" = "4"
          test -s "$WORK/verify/vendor_ramdisk00"
          test -s "$WORK/verify/vendor_ramdisk01"
          test -s "$WORK/verify/dtb"
          cmp "$WORK/stock/vendor_ramdisk00" "$WORK/verify/vendor_ramdisk00"
          cmp "$WORK/stock/dtb" "$WORK/verify/dtb"
          cmp "$WORK/built/ramdisk" "$WORK/verify/vendor_ramdisk01"

          cp -f "$WORK/new/vendor_boot.img" "$OUT/vendor_boot.img"
          ls -lh "$OUT/vendor_boot.img"
          sha256sum "$OUT/vendor_boot.img"
      - name: Show build outputs
        if: always()
        working-directory: ${{ env.FOX_ROOT }}
        shell: bash
        run: |
          set +e
          OUT="out/target/product/beryl"
          ls -lah "$OUT" 2>/dev/null || true
          find "$OUT" -maxdepth 1 -type f \( -name '*recovery*.img' -o -name 'vendor_boot*.img' \) -printf '%p %s bytes\\n' 2>/dev/null || true
          ccache -s || true
          df -h
          free -h

      - name: Cleanup workspace
        if: always()
        shell: bash
        run: |
          set +e
          echo "Cleaning temporary sync/build state..."
          rm -rf "$RUNNER_TEMP/orangefox-sync"
          rm -rf "$RUNNER_TEMP/vendorboot-merge"
          rm -rf "$RUNNER_TEMP/mkbootimg"
          rm -rf "$FOX_ROOT/.repo"
          rm -rf "$FOX_ROOT/.git"
          rm -rf "$CCACHE_DIR/tmp"
          sync
          df -h
          du -sh "$FOX_ROOT" 2>/dev/null || true

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-beryl-recovery
          path: |
            ${{ env.FOX_ROOT }}/out/target/product/beryl/recovery.img
            ${{ env.FOX_ROOT }}/out/target/product/beryl/vendor_boot.img
          if-no-files-found: warn
          retention-days: 7
