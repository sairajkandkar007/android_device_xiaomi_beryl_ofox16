name: Extract Stock ROM Payload

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "Direct HTTPS URL to the stock ROM ZIP"
        required: true
        type: string
      release_tag:
        description: "Release tag"
        required: true
        default: "stock-images"
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native Python payload dumper
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install android-payload-dumper==2.3.0
          payload-dumper --version

      - name: Download stock ROM ZIP
        env:
          ROM_URL: ${{ inputs.rom_url }}
        run: |
          mkdir -p work/images
          curl -L --fail --retry 5 --retry-all-errors --progress-bar \
            "$ROM_URL" -o work/stock.zip
          ls -lh work/stock.zip

      - name: Extract every payload image
        run: |
          payload-dumper work/stock.zip -o work/images -j 4

      - name: List extracted images
        run: |
          echo "Extracted images:"
          find work/images -maxdepth 1 -type f -name '*.img' \
            -printf '%f %s bytes\n' | sort

      - name: Create release and upload all images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          images=(work/images/*.img)

          if [ ${#images[@]} -eq 0 ]; then
            echo "No .img files were extracted."
            exit 1
          fi

          gh release create "$TAG" "${images[@]}" \
            --title "Stock payload images - $TAG" \
            --notes "Images extracted from the supplied stock ROM ZIP with the Python android-payload-dumper tool."
