name: Extract Stock ROM Payload

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "Direct URL to the Xiaomi ROM ZIP"
        required: true
        default: "https://bigota.d.miui.com/OS3.0.302.0.WOQINXM/beryl_in_global-ota_full-OS3.0.302.0.WOQINXM-user-16.0-1c6da5a6c2.zip"
        type: string
      release_tag:
        description: "Release tag"
        required: true
        default: "stock-images"
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install aria2 and payload-dumper-go
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          
          # Download and install payload-dumper-go (v1.2.2)
          wget -q https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
          tar -xzf payload-dumper-go_1.2.2_linux_amd64.tar.gz
          sudo mv payload-dumper-go /usr/local/bin/
          rm payload-dumper-go_1.2.2_linux_amd64.tar.gz

      - name: Download ROM using parallel CDNs
        run: |
          mkdir -p work/images
          
          ROM_URL="${{ inputs.rom_url }}"
          MIRRORS=("$ROM_URL")
          
          if [[ "$ROM_URL" == *".miui.com"* ]] || [[ "$ROM_URL" == *".azureedge.net"* ]]; then
            ROM_PATH=$(echo "$ROM_URL" | sed -E 's|^https?://[^/]+(/.*)|\1|')
            
            CDNS=(
              "bigota.d.miui.com"
              "hugeota.d.miui.com"
              "bn.d.miui.com"
              "cdnorg.d.miui.com"
              "cdn-ota.azureedge.net"
              "airtel.bigota.d.miui.com"
              "bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com"
            )
            
            for CDN in "${CDNS[@]}"; do
              CANDIDATE="https://$CDN$ROM_PATH"
              
              if [[ "$CANDIDATE" == "$ROM_URL" ]]; then continue; fi
              
              if curl -s -I -L -f --max-time 3 "$CANDIDATE" > /dev/null; then
                echo "✅ Found active mirror: $CDN"
                MIRRORS+=("$CANDIDATE")
              else
                echo "❌ Not synced on: $CDN"
              fi
            done
          fi
          
          echo "Downloading concurrently from validated mirrors:"
          printf '  %s\n' "${MIRRORS[@]}"

          aria2c \
            --file-allocation=none \
            --continue=true \
            --max-connection-per-server=16 \
            --split=64 \
            --min-split-size=1M \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --max-tries=8 \
            --retry-wait=3 \
            --connect-timeout=15 \
            --timeout=60 \
            --summary-interval=10 \
            --console-log-level=notice \
            --dir=work \
            --out=stock.zip \
            "${MIRRORS[@]}"

          ls -lh work/stock.zip

      - name: Extract every payload image
        run: |
          # Use payload-dumper-go natively (it automatically utilizes all CPU cores)
          payload-dumper-go -o work/images work/stock.zip

      - name: List extracted images
        run: |
          echo "Extracted images:"
          find work/images -maxdepth 1 -type f -name '*.img' \
            -printf '%f %s bytes\n' | sort

      - name: Create release and upload all images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          images=(work/images/*.img)

          if [ ${#images[@]} -eq 0 ]; then
            echo "No .img files were extracted."
            exit 1
          fi

          gh release create "$TAG" "${images[@]}" \
            --title "Stock payload images - $TAG" \
            --notes "Images extracted from stock ROM ZIP. Downloaded via parallel aria2 multi-CDN array. Extracted using payload-dumper-go."
