name: Extract Stock ROM Payload

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag"
        required: true
        default: "stock-images"
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install aria2 and Python payload dumper
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2
          python3 -m pip install --upgrade pip
          python3 -m pip install android-payload-dumper==2.3.0

      - name: Benchmark candidate CDNs
        id: benchmark
        env:
          ROM_URLS: |
            https://bigota.d.miui.com/OS3.0.302.0.WOQINXM/beryl_in_global-ota_full-OS3.0.302.0.WOQINXM-user-16.0-1c6da5a6c2.zip
            https://hugeota.d.miui.com/OS3.0.302.0.WOQINXM/beryl_in_global-ota_full-OS3.0.302.0.WOQINXM-user-16.0-1c6da5a6c2.zip
        run: |
          set -uo pipefail
          mkdir -p work/bench
          : > work/bench/results.tsv

          printf '%s\n' "$ROM_URLS" | sed '/^[[:space:]]*$/d' | while IFS= read -r url; do
            echo "Benchmarking: $url"
            out="work/bench/test-$(date +%s%N).bin"

            start=$(date +%s%N)
            if curl -L --fail --silent --show-error \
                --range 0-2097151 \
                --connect-timeout 15 --max-time 120 \
                -o "$out" "$url"; then
              end=$(date +%s%N)
              bytes=$(stat -c '%s' "$out")
              elapsed_ms=$(( (end-start) / 1000000 ))

              if [ "$elapsed_ms" -gt 0 ] && [ "$bytes" -gt 0 ]; then
                speed=$(awk -v b="$bytes" -v ms="$elapsed_ms" 'BEGIN {printf "%.2f", b/ms*1000/1048576}')
                printf '%s\t%s\t%s\n' "$speed" "$elapsed_ms" "$url" >> work/bench/results.tsv
                echo "  $speed MiB/s ($bytes bytes in ${elapsed_ms} ms)"
              else
                echo "  invalid benchmark result"
              fi
            else
              echo "  FAILED"
            fi
            rm -f "$out"
          done

          if [ ! -s work/bench/results.tsv ]; then
            echo "No CDN candidate completed the benchmark."
            exit 1
          fi

          echo
          echo "=== CDN benchmark ==="
          sort -nr work/bench/results.tsv

          fastest=$(sort -nr work/bench/results.tsv | head -n1 | cut -f3-)
          {
            echo "fastest_url<<EOF"
            echo "$fastest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download ROM with fastest CDN
        env:
          FASTEST_URL: ${{ steps.benchmark.outputs.fastest_url }}
        run: |
          mkdir -p work/images
          echo "Selected CDN:"
          echo "$FASTEST_URL"

          aria2c \
            --file-allocation=none \
            --continue=true \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=20M \
            --max-tries=8 \
            --retry-wait=3 \
            --connect-timeout=15 \
            --timeout=60 \
            --summary-interval=10 \
            --console-log-level=notice \
            --dir=work \
            --out=stock.zip \
            "$FASTEST_URL"

          ls -lh work/stock.zip

      - name: Extract every payload image
        run: |
          payload-dumper work/stock.zip -o work/images -j 4

      - name: List extracted images
        run: |
          echo "Extracted images:"
          find work/images -maxdepth 1 -type f -name '*.img' \
            -printf '%f %s bytes\n' | sort

      - name: Create release and upload all images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          shopt -s nullglob
          images=(work/images/*.img)

          if [ ${#images[@]} -eq 0 ]; then
            echo "No .img files were extracted."
            exit 1
          fi

          gh release create "$TAG" "${images[@]}" \
            --title "Stock payload images - $TAG" \
            --notes "Images extracted from the supplied stock ROM ZIP. CDN selected by a measured range-download benchmark; ROM downloaded with aria2."
